name: 🚀 Deploy Website to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Cloudflare Pages (proyecto "ingelyv"). Publica solo dist/ (lista blanca de scripts/build-dist.sh).
  pages-deploy:
    name: ⚡ Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📥 Install dependencies
      run: npm ci

    - name: 🎨 Build Tailwind CSS
      run: npm run build:css

    - name: 📦 Build public site (dist/)
      run: bash scripts/build-dist.sh

    - name: ⚡ Deploy to Cloudflare Pages
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: 70e0b9b26ed031bec7be6e5a8fb9b7ce
        command: pages deploy dist --project-name=ingelyv --branch=main
