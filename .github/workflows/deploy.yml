name: 🚀 Deploy Website (FTP + Cloudflare Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Producción actual: Web Host Chile vía FTP (sirve www.ingelyv.cl).
  # Se retira cuando el dominio apunte a Cloudflare Pages y esté verificado.
  web-deploy:
    name: 🚚 Deploy FTP (producción actual)
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📂 Sync files to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ftp.ingelyv.cl
        username: ingelyvc
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: public_html/
        exclude: |
          **/.git*
          **/.git*/**
          **/.agents/**
          **/README.md
          **/CLAUDE.md
          **/scripts/**
          **/dist/**

  # Migración: Cloudflare Pages (proyecto "ingelyv" → ingelyv.pages.dev).
  # Publica solo dist/ (lista blanca de scripts/build-dist.sh).
  # Si el secret CLOUDFLARE_API_TOKEN no existe, el deploy se omite sin fallar.
  pages-deploy:
    name: ⚡ Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📦 Build public site (dist/)
      run: bash scripts/build-dist.sh

    - name: ⏭️ Secret no configurado
      if: env.CLOUDFLARE_API_TOKEN == ''
      run: echo "::warning::CLOUDFLARE_API_TOKEN no está configurado; se omite el deploy a Cloudflare Pages."

    - name: ⚡ Deploy to Cloudflare Pages
      if: env.CLOUDFLARE_API_TOKEN != ''
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: 70e0b9b26ed031bec7be6e5a8fb9b7ce
        command: pages deploy dist --project-name=ingelyv --branch=main
