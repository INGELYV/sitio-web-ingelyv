name: ✅ Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: 🔍 Build y validaciones
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📥 Install dependencies
      run: npm ci

    - name: 🎨 Build (Tailwind + dist/)
      run: npm run build

    - name: 🧾 Validar HTML
      run: npm run validate:html

    - name: 🔗 Chequeos del sitio (enlaces, SEO, versionado, sitemap)
      run: node scripts/check-site.mjs
